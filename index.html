<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Website Coming Soon</title>
  <meta name="description" content="Our website is currently under construction. Stay tuned for something amazing." />
  <meta name="theme-color" content="#0f172a" />

  <!-- Open Graph -->
  <meta property="og:title" content="Website Coming Soon" />
  <meta property="og:description" content="Something awesome is being built right now." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://yourdomain.com/preview.jpg" />
  <meta property="og:url" content="https://yourdomain.com" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Website Coming Soon" />
  <meta name="twitter:description" content="Something awesome is being built right now." />
  <meta name="twitter:image" content="https://yourdomain.com/preview.jpg" />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      position: relative;
    }

    .bg {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      animation: float 12s infinite linear;
    }

    .circle:nth-child(1) {
      width: 200px;
      height: 200px;
      top: 10%;
      left: 5%;
    }

    .circle:nth-child(2) {
      width: 300px;
      height: 300px;
      bottom: -50px;
      right: 10%;
      animation-duration: 18s;
    }

    .circle:nth-child(3) {
      width: 120px;
      height: 120px;
      top: 60%;
      left: 40%;
      animation-duration: 10s;
    }

    @keyframes float {
      0% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-30px) rotate(180deg);
      }
      100% {
        transform: translateY(0px) rotate(360deg);
      }
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 30px;
      max-width: 700px;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    p {
      font-size: 1.2rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 0.9rem;
      color: #94a3b8;
      backdrop-filter: blur(10px);
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(59,130,246,0.15);
      filter: blur(120px);
      border-radius: 50%;
      z-index: 1;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.5rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="bg">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <div class="glow"></div>

  <div class="container">
    <div class="badge">🚧 UNDER CONSTRUCTION</div>

    <h1>No Website Right Now</h1>

    <p>
      We’re building something clean, fast, and powerful.<br>
      Check back later for the full experience.
    </p>
  </div>

</body>
  </html>
